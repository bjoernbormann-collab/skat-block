                            {ansagen >= 1 && <button onClick={() => setAnsagen(ansagen === 2 ? 1 : 2)} className={`px-2.5 py-1.5 rounded-lg text-[10px] font-medium border ${ansagen >= 2 ? 'bg-amber-500/20 text-amber-500 border-amber-500/50' : 'bg-app-base border-app-border text-app-faint'}`}>Schwarz angesagt</button>}
                            {ansagen >= 2 && <button onClick={() => setAnsagen(ansagen === 3 ? 2 : 3)} className={`px-2.5 py-1.5 rounded-lg text-[10px] font-medium border ${ansagen === 3 ? 'bg-amber-500/20 text-amber-500 border-amber-500/50' : 'bg-app-base border-app-border text-app-faint'}`}>Ouvert</button>}
                          </div>
                        )}
                      </div>
                      
                      <div className="bg-app-element/30 p-3 rounded-2xl border border-app-border space-y-2 mt-2">
                        <div className="flex justify-between items-center">
                          <label className="text-[10px] font-semibold text-app-muted uppercase tracking-wider">Im Skat überreizt?</label>
                          <button onClick={() => setIsOverbid(!isOverbid)} className={`w-10 h-5 rounded-full relative transition-colors ${isOverbid ? 'bg-rose-500' : 'bg-app-borderstrong'}`}>
                            <div className={`w-3.5 h-3.5 bg-white rounded-full absolute top-[3px] transition-transform ${isOverbid ? 'translate-x-[22px]' : 'translate-x-1'}`} />
                          </button>
                        </div>
                        {isOverbid && (
                           <input type="number" value={bidValue} onChange={(e) => setBidValue(Number(e.target.value))} placeholder="Gereizt bis (z.B. 48)" className="w-full mt-2 block box-border bg-app-base border border-rose-500/50 rounded-xl px-3 py-2 text-sm text-center text-app-text focus:outline-none focus:border-rose-500" />
                        )}
                      </div>
                    </>
                  )}
                </div>
              )}
              
              <div className="pt-2">
                {gameType !== 'ramsch' && (
                  <div className="bg-app-element/30 p-1.5 rounded-xl border border-app-border mb-3 flex justify-between items-center">
                    <button onClick={() => setKontra(0)} className={`flex-1 py-2 text-[10px] font-bold rounded-lg transition-colors ${kontra === 0 ? 'bg-slate-700 text-white shadow-sm' : 'text-app-faint hover:bg-app-element'}`}>Normal</button>
                    <button onClick={() => setKontra(1)} className={`flex-1 py-2 text-[10px] font-bold rounded-lg transition-colors ${kontra === 1 ? 'bg-rose-500/20 text-rose-500 shadow-sm' : 'text-app-faint hover:bg-app-element'}`}>Kontra <span className="opacity-50">(x2)</span></button>
                    <button onClick={() => setKontra(2)} className={`flex-1 py-2 text-[10px] font-bold rounded-lg transition-colors ${kontra === 2 ? 'bg-rose-500/40 text-rose-500 shadow-sm' : 'text-app-faint hover:bg-app-element'}`}>Re <span className="opacity-50">(x4)</span></button>
                    <button onClick={() => setKontra(3)} className={`flex-1 py-2 text-[10px] font-bold rounded-lg transition-colors ${kontra === 3 ? 'bg-rose-500/60 text-rose-500 shadow-sm' : 'text-app-faint hover:bg-app-element'}`}>Hirsch <span className="opacity-50">(x8)</span></button>
                  </div>
                )}
                <button onClick={() => setIsBock(!isBock)} className={`w-full py-2.5 rounded-xl border flex items-center justify-center gap-2 text-xs font-bold uppercase tracking-wide transition-colors ${isBock ? 'bg-amber-500/20 text-amber-500 border-amber-500/50' : 'bg-app-base border-app-border text-app-faint hover:border-app-borderstrong'}`}>
                  Bockrunde (Punkte x2) {isBock && activeBockRounds > 0 && !isEditing ? `(Auto)` : ''}
                </button>
              </div>

            </div>

            <div className="bg-app-panel border-t border-app-border p-3 shrink-0">
              <div className="flex justify-center items-baseline gap-1.5 mb-2">
                <span className="text-xs text-app-muted">Gesamtwert:</span>
                <span className={`text-2xl font-black ${gameType === 'ramsch' || isOverbid ? 'text-rose-500' : 'text-amber-500'}`}>{calculatedPoints}</span>
              </div>
              
              {gameType === 'ramsch' ? (
                <button onClick={() => handleSaveClick(false)} disabled={calculatedPoints === 0 || isNaN(calculatedPoints)} className="w-full py-3 rounded-xl text-sm font-bold bg-rose-500/10 text-rose-500 border border-rose-500/30 disabled:opacity-50">Ramsch speichern</button>
              ) : (
                <div className="grid grid-cols-2 gap-2">
                  <button onClick={() => handleSaveClick(false)} disabled={calculatedPoints === 0 || isNaN(calculatedPoints)} className={`py-3 rounded-xl text-sm font-bold bg-rose-500/10 text-rose-500 border border-rose-500/30 disabled:opacity-50 ${isOverbid ? 'col-span-2' : ''}`}>Verloren {isOverbid && '(Überreizt)'}</button>
                  {!isOverbid && <button onClick={() => handleSaveClick(true)} disabled={calculatedPoints === 0 || isNaN(calculatedPoints)} className="py-3 rounded-xl text-sm font-bold bg-emerald-500 text-slate-950 disabled:opacity-50">{isEditing ? 'Speichern' : 'Gewonnen'}</button>}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function ToggleChip({ label, active, onClick }) {
      return <button onClick={onClick} className={`px-3 py-1.5 rounded-xl text-[11px] font-medium border ${active ? 'bg-slate-700 text-white border-slate-500' : 'bg-app-base border-app-border text-app-faint'}`}>{label}</button>;
    }

    function ToggleSetting({ label, active, onClick, extraClass = "" }) {
      return (
        <div className={`flex items-center justify-between p-1 ${extraClass}`}>
          <span className="text-xs font-medium text-app-text">{label}</span>
          <button onClick={onClick} className={`w-10 h-5 rounded-full relative transition-colors ${active ? 'bg-amber-500' : 'bg-app-borderstrong'}`}>
            <div className={`w-3.5 h-3.5 bg-white rounded-full absolute top-[3px] transition-transform ${active ? 'translate-x-[22px]' : 'translate-x-1'}`} />
          </button>
        </div>
      );
    }

    function SettingsSheet({ players, setPlayers, rounds, setRounds, theme, setTheme, centPerPoint, setCentPerPoint, penaltyPerLoss, setPenaltyPerLoss, autoBockTriggers, setAutoBockTriggers, seriesLimit, setSeriesLimit, ruleDoubleLostHand, setRuleDoubleLostHand, onClose }) {
      const updatePlayer = (index, value) => { const newPlayers = [...players]; newPlayers[index] = value; setPlayers(newPlayers); };

      return (
        <div className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4 bg-app-base/70 backdrop-blur-sm animate-in slide-in-from-bottom-4 sm:slide-in-from-bottom-0 sm:fade-in" style={{ zIndex: 90 }}>
          <div className="w-full max-w-sm bg-app-panel rounded-t-2xl sm:rounded-2xl border border-app-borderstrong shadow-2xl overflow-hidden flex flex-col max-h-[88vh] sm:max-h-[90vh]">
            <div className="flex items-center justify-between p-4 border-b border-app-border shrink-0">
              <h2 className="text-base font-bold text-app-text">Einstellungen</h2>
              <button onClick={onClose} className="p-2 text-app-text bg-app-element rounded-full hover:bg-app-border active:scale-95 transition-all shadow-sm border border-app-borderstrong/50"><X className="w-5 h-5" /></button>
            </div>
            <div className="p-4 space-y-5 overflow-y-auto custom-scrollbar pb-6">
              
              <div className="space-y-2.5">
                <h3 className="text-[10px] font-bold text-app-muted uppercase tracking-wider">Turnier-Modus</h3>
                <div className="bg-app-element/50 p-3 rounded-xl border border-app-border space-y-3">
                   <div className="flex items-center justify-between mb-1">
                      <span className="text-sm font-semibold text-app-text">Serienlänge</span>
                   </div>
                   <div className="flex gap-2">
                    {[0, 24, 36, 48].map(limit => (
                      <button key={limit} type="button" onClick={() => setSeriesLimit(limit)} className={`flex-1 py-1.5 rounded-lg border text-xs font-bold transition-colors ${seriesLimit === limit ? 'bg-amber-500/20 text-amber-500 border-amber-500/50 shadow-sm' : 'bg-app-base text-app-faint border-app-border hover:border-app-borderstrong'}`}>
                        {limit === 0 ? 'Endlos' : limit}
                      </button>
                    ))}
                  </div>
                  <p className="text-[9px] text-app-faint leading-snug">Legt fest, nach wie vielen Runden das Spiel für die finale Abrechnung automatisch endet.</p>
                </div>
              </div>

              <div className="space-y-2.5">
                <h3 className="text-[10px] font-bold text-app-muted uppercase tracking-wider">Regeln & Finanzen</h3>
                <div className="bg-app-element/50 p-3 rounded-xl border border-app-border space-y-4">
                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <div className="flex items-center gap-2">
                        <Banknote className="w-4 h-4 text-emerald-500"/>
                        <span className="text-sm font-semibold text-app-text">Cent pro Punkt</span>
                      </div>
                      <input type="number" inputMode="decimal" step="0.5" min="0" value={centPerPoint} onChange={(e) => setCentPerPoint(Number(e.target.value))} className="w-20 block box-border bg-app-base border border-app-borderstrong rounded-lg px-3 py-1.5 text-sm text-right text-app-text focus:outline-none focus:border-amber-500" />
                    </div>
                    <p className="text-[9px] text-app-faint leading-snug">Berechnet am Ende automatisch die Auszahlung basierend auf den erspielten Punktedifferenzen.</p>
                  </div>
                  
                  <div className="pt-3 border-t border-app-border">
                    <div className="flex items-center justify-between mb-1.5">
                      <div className="flex items-center gap-2">
                        <Banknote className="w-4 h-4 text-rose-500"/>
                        <span className="text-sm font-semibold text-app-text">Verlustgeld (Kasse)</span>
                      </div>
                      <div className="flex items-center gap-1.5">
                        <input type="number" inputMode="decimal" step="0.10" min="0" value={penaltyPerLoss} onChange={(e) => setPenaltyPerLoss(Number(e.target.value))} className="w-20 block box-border bg-app-base border border-app-borderstrong rounded-lg px-3 py-1.5 text-sm text-right text-app-text focus:outline-none focus:border-amber-500" />
                        <span className="text-sm font-semibold text-app-muted">€</span>
                      </div>
                    </div>
                    <p className="text-[9px] text-app-faint leading-snug">Zahlung pro verlorenem Spiel in eine gemeinsame Kasse.</p>
                  </div>

                  <div className="pt-3 border-t border-app-border">
                    <ToggleSetting label="Verlorenes Handspiel verdoppeln" active={ruleDoubleLostHand} onClick={() => setRuleDoubleLostHand(!ruleDoubleLostHand)} />
                    <p className="text-[9px] text-app-faint mt-1 leading-snug">Nach ISkO werden verlorene Handspiele verdoppelt. In privaten Runden wird dies oft deaktiviert.</p>
                  </div>
                </div>
              </div>

              <div className="space-y-2.5">
                <h3 className="text-[10px] font-bold text-app-muted uppercase tracking-wider flex items-center gap-1.5"><Zap className="w-3.5 h-3.5 text-amber-500" /> Auto-Bockrunden (Je {players.length} Spiele)</h3>
                <div className="bg-app-element/50 p-3 rounded-xl border border-app-border space-y-3">
                  <p className="text-[9px] text-app-faint pb-2 border-b border-app-border leading-snug">Fügt beim jeweiligen Ereignis automatisch eine neue Bockrunde (Punkte x2) pro Spieler am Tisch hinzu.</p>
                  <ToggleSetting label="Verlorenes Spiel" active={autoBockTriggers.lost} onClick={() => setAutoBockTriggers({...autoBockTriggers, lost: !autoBockTriggers.lost})} />
                  <ToggleSetting label="Runde eingepasst" active={autoBockTriggers.passed} onClick={() => setAutoBockTriggers({...autoBockTriggers, passed: !autoBockTriggers.passed})} />
                  <ToggleSetting label="Ramsch gespielt" active={autoBockTriggers.ramsch} onClick={() => setAutoBockTriggers({...autoBockTriggers, ramsch: !autoBockTriggers.ramsch})} />
                  <ToggleSetting label="Kontra / Re / Hirsch" active={autoBockTriggers.kontra} onClick={() => setAutoBockTriggers({...autoBockTriggers, kontra: !autoBockTriggers.kontra})} />
                  <ToggleSetting label="Grand Hand (Gewonnen)" active={autoBockTriggers.grandHand} onClick={() => setAutoBockTriggers({...autoBockTriggers, grandHand: !autoBockTriggers.grandHand})} />
                </div>
              </div>

              <div className="space-y-2.5">
                <h3 className="text-[10px] font-bold text-app-muted uppercase tracking-wider">Design & Anzeige</h3>
                <div className="flex items-center justify-between bg-app-element/50 p-3 rounded-xl border border-app-border">
                  <div className="flex items-center gap-2">
                    {theme === 'dark' ? <Moon className="w-4 h-4 text-app-faint"/> : <Sun className="w-4 h-4 text-amber-500"/>}
                    <span className="text-sm font-semibold text-app-text">Nachtmodus</span>
                  </div>
                  <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className={`w-12 h-6 rounded-full relative transition-colors ${theme === 'dark' ? 'bg-amber-500' : 'bg-app-borderstrong'}`}>
                    <div className={`w-4 h-4 bg-white rounded-full absolute top-1 transition-transform ${theme === 'dark' ? 'translate-x-7' : 'translate-x-1'}`} />
                  </button>
                </div>
              </div>

              <div className="space-y-2.5">
                <div className="flex justify-between items-baseline">
                   <h3 className="text-[10px] font-bold text-app-muted uppercase tracking-wider">Spielernamen</h3>
                   <span className="text-[9px] text-app-faint">Namen bearbeiten</span>
                </div>
                {players.map((p, i) => (
                  <div key={i} className="flex items-center gap-2">
                    <span className="text-xs font-semibold text-app-faint w-5">{i + 1}.</span>
                    <input type="text" value={p} onChange={(e) => updatePlayer(i, e.target.value)} className="w-full block box-border bg-app-base border border-app-border rounded-xl px-4 py-2.5 text-sm text-app-text focus:outline-none focus:border-amber-500" />
                  </div>
                ))}
              </div>

              <div className="pt-2"><button onClick={onClose} className="w-full py-3 rounded-xl text-sm font-bold bg-app-element text-app-text hover:bg-app-border flex justify-center items-center gap-1.5"><Check className="w-4 h-4 text-emerald-500" /><span>Speichern</span></button></div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const activeData = LocalStore.get('skat_active');
      const [isSetupPhase, setIsSetupPhase] = useState(() => !(activeData && activeData.players));
      const [gameDate, setGameDate] = useState(() => activeData?.gameDate || new Date().toISOString().split('T')[0]);
      const [players, setPlayers] = useState(() => activeData?.players || ['Spieler 1', 'Spieler 2', 'Spieler 3']);
      const [scoringSystem, setScoringSystem] = useState(() => activeData?.scoringSystem || 'classic');
      const [rounds, setRounds] = useState(() => activeData?.rounds || []);
      const [seriesLimit, setSeriesLimit] = useState(() => activeData?.seriesLimit || 0);
      const [eventMeta, setEventMeta] = useState(() => activeData?.eventMeta || { eventName: '', tableNumber: '', seriesNumber: '' });
      const [pastSessions, setPastSessions] = useState(() => LocalStore.get('skat_history') || []);
      
      const [bockRounds, setBockRounds] = useState(() => activeData?.bockRounds || 0);
      const [autoBockTriggers, setAutoBockTriggers] = useState(() => LocalStore.get('skat_autobock') || { lost: false, ramsch: false, kontra: false, grandHand: false, passed: false });

      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [editingRound, setEditingRound] = useState(null);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isSummaryOpen, setIsSummaryOpen] = useState(false);
      const [statsView, setStatsView] = useState(null);
      const [isProtocolOpen, setIsProtocolOpen] = useState(false);
      const [protocolData, setProtocolData] = useState(null);
      const [isHistoryOpen, setIsHistoryOpen] = useState(false);
      const [viewingHistorySession, setViewingHistorySession] = useState(null);
      
      const [theme, setTheme] = useState(() => LocalStore.get('skat_theme') || 'dark');
      const [centPerPoint, setCentPerPoint] = useState(() => Number(LocalStore.get('skat_cents')) || 1);
      const [penaltyPerLoss, setPenaltyPerLoss] = useState(() => Number(LocalStore.get('skat_penalty')) || 0);
      const [ruleDoubleLostHand, setRuleDoubleLostHand] = useState(() => { const v = LocalStore.get('skat_rule_doublehand'); return v !== null ? v : true; });

      const listEndRef = useRef(null);
      useEffect(() => { if (listEndRef.current && !editingRound && !isProtocolOpen) listEndRef.current.scrollIntoView({ behavior: 'smooth' }); }, [rounds, editingRound, isProtocolOpen]);

      useEffect(() => {
        if (!isSetupPhase) LocalStore.set('skat_active', { gameDate, players, scoringSystem, rounds, bockRounds, seriesLimit, eventMeta });
      }, [isSetupPhase, gameDate, players, scoringSystem, rounds, bockRounds, seriesLimit, eventMeta]);

      useEffect(() => {
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        LocalStore.set('skat_theme', theme);
      }, [theme]);

      useEffect(() => { LocalStore.set('skat_cents', centPerPoint); }, [centPerPoint]);
      useEffect(() => { LocalStore.set('skat_penalty', penaltyPerLoss); }, [penaltyPerLoss]);
      useEffect(() => { LocalStore.set('skat_autobock', autoBockTriggers); }, [autoBockTriggers]);
      useEffect(() => { LocalStore.set('skat_rule_doublehand', ruleDoubleLostHand); }, [ruleDoubleLostHand]);

      const totals = useMemo(() => {
        let t = new Array(players.length).fill(0);
        rounds.forEach(r => r.scores.forEach((s, i) => t[i] += s));
        return t;
      }, [rounds, players.length]);

      const history = useMemo(() => {
        let running = new Array(players.length).fill(0);
        return rounds.map(r => {
          r.scores.forEach((s, i) => running[i] += s);
          return { ...r, running: [...running] };
        });
      }, [rounds, players.length]);

      const currentDealerIndex = useMemo(() => {
        if (editingRound) return editingRound.dealerIndex;
        if (rounds.length === 0) return 0;
        return (rounds[rounds.length - 1].dealerIndex + 1) % players.length;
      }, [rounds, players.length, editingRound]);

      const handleFinishEvening = () => {
        if (rounds.length === 0) return;
        const newSession = { id: Date.now(), gameDate, players, scoringSystem, rounds, totals, seriesLimit, centPerPoint, penaltyPerLoss, eventMeta, bockRounds };
        const newHist = [newSession, ...pastSessions];
        setPastSessions(newHist);
        LocalStore.set('skat_history', newHist);
        setRounds([]); setBockRounds(0); setIsSetupPhase(true); LocalStore.remove('skat_active');
        setIsSummaryOpen(false); setViewingHistorySession(newSession);
      };

      const handleRestoreSession = (session) => {
        // Zustand wiederherstellen
        setGameDate(session.gameDate);
        setPlayers(session.players);
        setScoringSystem(session.scoringSystem || 'classic');
        setRounds(session.rounds);
        setSeriesLimit(session.seriesLimit || 0);
        setEventMeta(session.eventMeta || { eventName: '', tableNumber: '', seriesNumber: '' });
        setCentPerPoint(session.centPerPoint || 1);
        setPenaltyPerLoss(session.penaltyPerLoss || 0);
        setBockRounds(session.bockRounds || 0);

        // Aus Historie löschen, da es jetzt wieder das aktive Spiel ist
        const newHist = pastSessions.filter(s => s.id !== session.id);
        setPastSessions(newHist);
        LocalStore.set('skat_history', newHist);

        setIsSetupPhase(false);
        setViewingHistorySession(null);
        setIsHistoryOpen(false);
      };

      const handleSaveRound = (roundData, roundDetails) => {
        const { declarerIndex, points, won, isPassed, isRamsch, isBock } = roundData;
        const newScores = new Array(players.length).fill(0);
        const thisRoundDealerIndex = editingRound ? editingRound.dealerIndex : currentDealerIndex;

        let lossMultiplier = 2;
        if (roundDetails?.hand && !ruleDoubleLostHand) lossMultiplier = 1;

        if (!isPassed) {
          if (isRamsch) {
            newScores[declarerIndex] = -points;
          } else {
            const activeOpponents = players.map((_, i) => i).filter(i => i !== declarerIndex && (players.length === 3 || i !== thisRoundDealerIndex));
            
            if (scoringSystem === 'classic') {
              newScores[declarerIndex] = won ? points : points * -lossMultiplier;
            } else if (scoringSystem === 'seeger') {
              if (won) {
                newScores[declarerIndex] = points + 50;
              } else {
                newScores[declarerIndex] = (points * -lossMultiplier) - 50;
                activeOpponents.forEach(i => newScores[i] = 40);
              }
            } else if (scoringSystem === 'bierlachs') {
              if (won) {
                activeOpponents.forEach(i => newScores[i] = -points);
              } else {
                newScores[declarerIndex] = points * -lossMultiplier;
              }
            }
          }
        }

        const finalRoundData = {
          id: editingRound ? editingRound.id : Date.now(),
          dealerIndex: thisRoundDealerIndex,
          declarerIndex, points, won, isPassed, isRamsch, isBock,
          scores: newScores,
          details: roundDetails
        };

        if (editingRound) {
          setRounds(rounds.map(r => r.id === editingRound.id ? finalRoundData : r));
        } else {
          setRounds([...rounds, finalRoundData]);
          
          let currentBockRounds = bockRounds;
          if (isBock && !isPassed) currentBockRounds = Math.max(0, currentBockRounds - 1);
          
          if (!isPassed) {
            if (autoBockTriggers.lost && !won && !isRamsch) currentBockRounds += players.length;
            if (autoBockTriggers.ramsch && isRamsch) currentBockRounds += players.length;
            if (autoBockTriggers.kontra && roundDetails.kontra > 0) currentBockRounds += players.length;
            if (autoBockTriggers.grandHand && roundDetails.gameType === 'suit' && roundDetails.suit?.id === 'grand' && roundDetails.hand && won) currentBockRounds += players.length;
          } else {
            if (autoBockTriggers.passed) currentBockRounds += players.length;
          }
          setBockRounds(currentBockRounds);
        }
        
        if (navigator.vibrate) navigator.vibrate(40);
        
        setIsAddModalOpen(false); setEditingRound(null);
      };

      const handleDeleteRound = (id) => {
        setRounds(rounds.filter(r => r.id !== id));
        setIsAddModalOpen(false); setEditingRound(null);
      };

      const gridClass = players.length === 4 ? 'grid-cols-4' : 'grid-cols-3';
      const isSeriesComplete = seriesLimit > 0 && rounds.length >= seriesLimit;

      const getShortGameInfo = (round) => {
        if (!round.details) return '';
        if (round.details.mode === 'manual' && !round.isRamsch) return 'Manuell';
        if (round.isRamsch) return '';
        if (round.details.gameType === 'null') {
           const l = round.details.nullType?.label || '';
           return l === 'Einfach' ? 'Null' : `Null ${l}`;
        }
        if (round.details.gameType === 'suit') {
           let info = round.details.suit?.label || '';
           if (round.details.hand) {
               info += ' Hand';
           } else if (round.details.jacks) {
               const m = round.details.jacks.c ? 'mit ' : 'ohne ';
               info += ` ${m}${round.details.spitzen}`;
           }
           if (round.details.ansagen >= 3) info += ' Ouvert';
           return info;
        }
        return '';
      };

      return (
        <div className="h-full w-full bg-app-base text-app-text font-sans selection:bg-amber-500/30">
          
          {/* Main App Container - hidden when Protocol is open */}
          <div className={`w-full h-full ${isProtocolOpen ? 'print:hidden hidden' : 'block'}`}>
            {isSetupPhase ? (
              <SetupScreen players={players} setPlayers={setPlayers} gameDate={gameDate} setGameDate={setGameDate} scoringSystem={scoringSystem} setScoringSystem={setScoringSystem} seriesLimit={seriesLimit} setSeriesLimit={setSeriesLimit} eventMeta={eventMeta} setEventMeta={setEventMeta} onStart={() => setIsSetupPhase(false)} onOpenHistory={() => setIsHistoryOpen(true)} theme={theme} setTheme={setTheme} />
            ) : (
              <div className="w-full h-full max-w-md mx-auto relative flex flex-col bg-app-panel sm:border-x border-app-border/50">
                <header className="shrink-0 z-20 backdrop-blur-xl bg-app-panel/80 border-b border-app-border px-3 py-2 flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-full bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center shadow-md shadow-amber-500/20 shrink-0">
                      <ModernSkatLogo className="w-7 h-7 text-slate-950" />
                    </div>
                    <div className="flex flex-col">
                      <h1 className="text-lg font-bold bg-gradient-to-r from-app-text to-app-muted bg-clip-text text-transparent leading-none">Skat Block</h1>
                      <div className="flex items-center gap-1 mt-0.5">
                        <span className="text-[9px] text-amber-500 font-bold uppercase tracking-wider">{new Date(gameDate).toLocaleDateString('de-DE')}</span>
                        <span className="text-[9px] text-app-faint">•</span>
                        <span className="text-[9px] text-app-muted truncate max-w-[80px]">{SCORING_SYSTEMS.find(s => s.id === scoringSystem)?.short}</span>
                        {seriesLimit > 0 && (
                          <>
                            <span className="text-[9px] text-app-faint">•</span>
                            <span className={`text-[9px] font-bold px-1 rounded-sm ${isSeriesComplete ? 'bg-emerald-500/20 text-emerald-500' : 'bg-amber-500/10 text-amber-500'}`}>
                              {Math.min(rounds.length, seriesLimit)}/{seriesLimit}
                            </span>
                          </>
                        )}
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center gap-0.5">
                    <button onClick={() => setIsHistoryOpen(true)} className="p-1.5 text-app-muted hover:text-amber-400 hover:bg-app-element rounded-full transition-colors"><Clock className="w-5 h-5" /></button>
                    <button onClick={() => setStatsView({ stats: computePlayerStats(players, rounds), title: 'Aktuelle Runde', players, rounds })} className="p-1.5 text-app-muted hover:text-amber-400 hover:bg-app-element rounded-full transition-colors"><TrendingUp className="w-5 h-5" /></button>
                    <button onClick={() => setIsSummaryOpen(true)} className="p-1.5 text-app-muted hover:text-amber-400 hover:bg-app-element rounded-full transition-colors"><BarChart2 className="w-5 h-5" /></button>
                    <button onClick={() => setIsSettingsOpen(true)} className="p-1.5 text-app-muted hover:text-app-text hover:bg-app-element rounded-full transition-colors"><Settings className="w-5 h-5" /></button>
                  </div>
                </header>

                {bockRounds > 0 && (
                  <div className="shrink-0 bg-gradient-to-r from-amber-500/20 to-orange-500/10 border-b border-amber-500/30 px-3 py-1.5 flex items-center justify-center gap-2 text-amber-500 font-bold text-[10px] uppercase tracking-wider animate-in slide-in-from-top">
                    <Zap className="w-3.5 h-3.5" />
                    {bockRounds} Auto-Bockrunden verbleibend
                  </div>
                )}

                <div className="flex-1 overflow-y-auto custom-scrollbar relative">
                  <div className={`sticky top-0 z-10 grid ${gridClass} bg-app-panel/95 backdrop-blur shadow-sm border-b border-app-border`}>
                    {players.map((p, i) => (
                      <div key={i} className="px-1 py-2 text-center border-r border-app-border last:border-0 relative flex flex-col items-center justify-center">
                        <div className="flex items-center justify-center gap-1 w-full px-1">
                          <div className="text-[10px] font-semibold text-app-muted uppercase tracking-wider truncate mb-0.5">{p}</div>
                          {currentDealerIndex === i && !isSeriesComplete && (
                            <div className="bg-amber-500 text-slate-950 text-[8px] font-black px-1 rounded-sm shrink-0 mb-0.5" title="Geber">G</div>
                          )}
                        </div>
                        <div className={`text-base sm:text-lg font-bold ${totals[i] < 0 ? 'text-rose-400' : totals[i] > 0 ? 'text-emerald-500' : 'text-app-text'}`}>{totals[i]}</div>
                      </div>
                    ))}
                  </div>

                  <div className="p-1.5 space-y-1 pb-24">
                    {history.length === 0 ? (
                      <div className="text-center py-10 text-app-faint flex flex-col items-center">
                        <div className="w-12 h-12 rounded-full bg-app-element flex items-center justify-center mb-3 opacity-50"><Edit3 className="w-5 h-5" /></div>
                        <p className="text-sm">Noch keine Spiele.</p>
                      </div>
                    ) : (
                      history.map((round, idx) => (
                        <div key={round.id} onClick={() => { setEditingRound(round); setIsAddModalOpen(true); }} className={`grid ${gridClass} bg-app-element/30 rounded-lg overflow-hidden group relative cursor-pointer active:bg-app-element/70 hover:bg-app-element/50 transition-colors`}>
                          
                          {round.isPassed && (
                            <div className="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
                              <span className="bg-app-panel/90 text-app-muted text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-full border border-app-borderstrong">Eingepasst</span>
                            </div>
                          )}

                          {players.map((_, pIdx) => {
                            const isDeclarer = round.declarerIndex === pIdx && !round.isPassed;
                            const roundScore = round.scores[pIdx];
                            const opacityClass = round.isPassed ? 'opacity-30' : 'opacity-100';
                            
                            return (
                              <div key={pIdx} className={`py-2 px-1 text-center border-r border-app-border/50 last:border-0 flex flex-col justify-center relative ${isDeclarer ? (round.won ? 'bg-emerald-900/10' : 'bg-rose-900/10') : ''}`}>
                                {isDeclarer && (
                                  <div className={`absolute top-1 left-1 w-1.5 h-1.5 rounded-full ${round.isRamsch ? 'bg-amber-500/50' : (round.won ? 'bg-emerald-500/50' : 'bg-rose-500/50')}`} />
                                )}
                                <span className={`text-sm sm:text-base font-bold leading-tight ${opacityClass} ${round.running[pIdx] < 0 ? 'text-rose-400' : round.running[pIdx] > 0 ? 'text-emerald-500' : 'text-app-text'}`}>
                                  {round.running[pIdx]}
                                </span>
                                
                                <div className={`text-[9px] leading-tight flex flex-col items-center justify-center gap-0.5 mt-0.5 ${opacityClass} ${roundScore > 0 ? 'text-emerald-500' : roundScore < 0 ? 'text-rose-500' : 'text-app-faint'}`}>
                                  <div className="flex items-center gap-0.5">
                                    {roundScore !== 0 ? `${roundScore > 0 ? '+' : ''}${roundScore}` : '-'}
                                    {isDeclarer && round.isBock && <span className="text-amber-400 font-bold ml-0.5">B</span>}
                                    {isDeclarer && round.isRamsch && <span className="text-amber-400 font-bold ml-0.5">R</span>}
                                    {isDeclarer && round.details?.kontra === 1 && <span className="text-rose-400 font-bold ml-0.5">K</span>}
                                    {isDeclarer && round.details?.kontra === 2 && <span className="text-rose-400 font-bold ml-0.5">Re</span>}
                                    {isDeclarer && round.details?.kontra === 3 && <span className="text-rose-400 font-bold ml-0.5">H</span>}
                                  </div>
                                  {isDeclarer && getShortGameInfo(round) && (
                                    <div className="text-[7.5px] font-medium text-app-muted bg-app-element px-1.5 py-[1px] rounded border border-app-borderstrong/50 max-w-[95%] truncate leading-none mt-0.5">
                                      {getShortGameInfo(round)}
                                    </div>
                                  )}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      ))
                    )}
                    {history.length > 0 && !isSeriesComplete && (
                      <div className="pt-6 pb-12 flex justify-center">
                        <button onClick={handleFinishEvening} className="px-6 py-3 bg-app-element/80 text-emerald-500 font-bold rounded-2xl border border-app-borderstrong/50 hover:bg-app-border hover:text-emerald-600 transition-colors flex items-center gap-2 text-sm shadow-md active:scale-95"><Flag className="w-4 h-4" /><span>Abend beenden & Speichern</span></button>
                      </div>
                    )}
                    <div ref={listEndRef} />
                  </div>
                </div>

                <div className="absolute bottom-4 left-0 right-0 flex justify-center items-center z-20 px-4 pointer-events-none gap-3">
                  {history.length > 0 && !isSeriesComplete && (
                    <button 
                      onClick={() => { setEditingRound(rounds[rounds.length - 1]); setIsAddModalOpen(true); }}
                      title="Letzte Runde korrigieren"
                      className="pointer-events-auto w-12 h-12 bg-app-panel text-app-muted hover:text-amber-500 rounded-2xl shadow-lg hover:scale-105 active:scale-95 transition-all flex items-center justify-center border border-app-borderstrong"
                    >
                      <RotateCcw className="w-5 h-5" />
                    </button>
                  )}
                  
                  {isSeriesComplete ? (
                    <button onClick={() => setIsSummaryOpen(true)} className="pointer-events-auto flex-1 max-w-[260px] bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-bold py-3.5 rounded-2xl shadow-[0_8px_30px_rgb(16,185,129,0.3)] hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm animate-pulse">
                      <Award className="w-5 h-5" /><span>Serie abschließen</span>
                    </button>
                  ) : (
                    <button onClick={() => { setEditingRound(null); setIsAddModalOpen(true); }} className="pointer-events-auto flex-1 max-w-[260px] bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 font-bold py-3.5 rounded-2xl shadow-[0_8px_30px_rgb(245,158,11,0.3)] hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm">
                      <Plus className="w-5 h-5" /><span>Neues Spiel</span>
                    </button>
                  )}
                </div>
              </div>
            )}

            {/* MODALS RENDER ORDER MATTERS FOR Z-INDEX (Rendered from bottom = Highest Z-Index) */}

            {isHistoryOpen && (
              <HistorySheet sessions={pastSessions} onClose={() => setIsHistoryOpen(false)} onViewSession={(s) => setViewingHistorySession(s)} />
            )}

            {isSummaryOpen && (
              <SummarySheet players={players} totals={totals} rounds={rounds} gameDate={gameDate} eventMeta={eventMeta} scoringSystem={SCORING_SYSTEMS.find(s => s.id === scoringSystem)} seriesLimit={seriesLimit} onClose={() => setIsSummaryOpen(false)} onFinishEvening={handleFinishEvening} onReset={() => { setRounds([]); setBockRounds(0); setIsSummaryOpen(false); setIsSetupPhase(true); LocalStore.remove('skat_active'); }} viewMode="active" onOpenStats={() => setStatsView({ stats: computePlayerStats(players, rounds), title: 'Aktuelle Runde', players, rounds })} onOpenProtocol={() => { setProtocolData({ players, rounds, totals, gameDate, eventMeta, penaltyPerLoss, centPerPoint, scoringSystem: SCORING_SYSTEMS.find(s => s.id === scoringSystem), seriesLimit }); setIsProtocolOpen(true); }} centPerPoint={centPerPoint} penaltyPerLoss={penaltyPerLoss} />
            )}

            {viewingHistorySession && (
              <SummarySheet players={viewingHistorySession.players} totals={viewingHistorySession.totals} rounds={viewingHistorySession.rounds} gameDate={viewingHistorySession.gameDate} eventMeta={viewingHistorySession.eventMeta} scoringSystem={SCORING_SYSTEMS.find(s => s.id === viewingHistorySession.scoringSystem)} seriesLimit={viewingHistorySession.seriesLimit || 0} onClose={() => setViewingHistorySession(null)} viewMode="history" onDeleteHistory={() => {
                  const newHist = pastSessions.filter(s => s.id !== viewingHistorySession.id);
                  setPastSessions(newHist); LocalStore.set('skat_history', newHist); setViewingHistorySession(null);
                }} onOpenStats={() => setStatsView({ stats: computePlayerStats(viewingHistorySession.players, viewingHistorySession.rounds), title: `Statistik: ${new Date(viewingHistorySession.gameDate).toLocaleDateString('de-DE')}`, players: viewingHistorySession.players, rounds: viewingHistorySession.rounds })} onOpenProtocol={() => { setProtocolData({ players: viewingHistorySession.players, rounds: viewingHistorySession.rounds, totals: viewingHistorySession.totals, gameDate: viewingHistorySession.gameDate, eventMeta: viewingHistorySession.eventMeta, penaltyPerLoss: viewingHistorySession.penaltyPerLoss || penaltyPerLoss, centPerPoint: viewingHistorySession.centPerPoint || centPerPoint, scoringSystem: SCORING_SYSTEMS.find(s => s.id === viewingHistorySession.scoringSystem), seriesLimit: viewingHistorySession.seriesLimit || 0 }); setIsProtocolOpen(true); }} centPerPoint={viewingHistorySession.centPerPoint || centPerPoint} penaltyPerLoss={viewingHistorySession.penaltyPerLoss || penaltyPerLoss} onRestore={() => handleRestoreSession(viewingHistorySession)} hasActiveGame={rounds.length > 0} />
            )}

            {isAddModalOpen && (
              <AddRoundSheet players={players} roundToEdit={editingRound} currentDealerIndex={currentDealerIndex} activeBockRounds={bockRounds} onClose={() => { setIsAddModalOpen(false); setEditingRound(null); }} onSave={handleSaveRound} onDelete={handleDeleteRound} />
            )}

            {isSettingsOpen && (
              <SettingsSheet players={players} setPlayers={setPlayers} theme={theme} setTheme={setTheme} centPerPoint={centPerPoint} setCentPerPoint={setCentPerPoint} penaltyPerLoss={penaltyPerLoss} setPenaltyPerLoss={setPenaltyPerLoss} autoBockTriggers={autoBockTriggers} setAutoBockTriggers={setAutoBockTriggers} seriesLimit={seriesLimit} setSeriesLimit={setSeriesLimit} ruleDoubleLostHand={ruleDoubleLostHand} setRuleDoubleLostHand={setRuleDoubleLostHand} onClose={() => setIsSettingsOpen(false)} />
            )}

            {/* MUST BE AT THE BOTTOM SO IT RENDERS ON TOP OF SUMMARY/HISTORY */}
            {statsView && (
              <StatsSheet stats={statsView.stats} title={statsView.title} onClose={() => setStatsView(null)} players={statsView.players} rounds={statsView.rounds} />
            )}
          </div>
          
          {/* Protocol Sheet - Visible only when toggled, automatically adapts to @media print */}
          {isProtocolOpen && protocolData && (
             <ProtocolSheet 
                players={protocolData.players} 
                rounds={protocolData.rounds} 
                totals={protocolData.totals} 
                gameDate={protocolData.gameDate} 
                eventMeta={protocolData.eventMeta}
                penaltyPerLoss={protocolData.penaltyPerLoss}
                centPerPoint={protocolData.centPerPoint}
                scoringSystem={protocolData.scoringSystem}
                seriesLimit={protocolData.seriesLimit}
                onClose={() => setIsProtocolOpen(false)} 
             />
          )}
          
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
