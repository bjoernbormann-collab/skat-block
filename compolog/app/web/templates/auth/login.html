{% extends "layout/base.html" %}
{% block title %}Anmelden{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm mt-12">
  <h1 class="text-2xl font-semibold mb-6 text-center">{{ app_name }}</h1>
  <form method="post" action="/login" class="bg-white rounded-lg shadow p-6 space-y-4">
    <input type="hidden" name="next" value="{{ next }}">
    {% if error %}
    <p class="rounded bg-red-50 border border-red-200 text-red-800 text-sm px-3 py-2">{{ error }}</p>
    {% endif %}
    <div>
      <label for="username" class="block text-sm font-medium mb-1">Benutzername</label>
      <input id="username" name="username" autocomplete="username" autofocus required
             class="w-full rounded border border-slate-300 px-3 py-2">
    </div>
    <div>
      <label for="password" class="block text-sm font-medium mb-1">Passwort</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required
             class="w-full rounded border border-slate-300 px-3 py-2">
    </div>
    <button class="w-full rounded bg-slate-900 text-white py-2 font-medium hover:bg-slate-700">
      Anmelden
    </button>
  </form>
</div>
{% endblock %}
