{% extends "layout/base.html" %}
{% block title %}Artikel{% endblock %}
{% block content %}
<div class="flex flex-wrap items-center gap-3 mb-5">
  <h1 class="text-2xl font-semibold">Artikel</h1>
  <span class="text-slate-500 text-sm">{{ total }} Treffer</span>
  <div class="ml-auto flex flex-wrap gap-2">
    <a href="/artikel/import" class="rounded border border-slate-300 bg-white px-3 py-2 text-sm hover:bg-slate-50">Import</a>
    <a href="/artikel/export?format=xlsx&q={{ q|urlencode }}&inaktiv={{ 'true' if inaktiv else 'false' }}"
       class="rounded border border-slate-300 bg-white px-3 py-2 text-sm hover:bg-slate-50">Export XLSX</a>
    <a href="/artikel/export?format=csv&q={{ q|urlencode }}&inaktiv={{ 'true' if inaktiv else 'false' }}"
       class="rounded border border-slate-300 bg-white px-3 py-2 text-sm hover:bg-slate-50">CSV</a>
    <a href="/artikel/neu" class="rounded bg-slate-900 text-white px-3 py-2 text-sm hover:bg-slate-700">Neuer Artikel</a>
  </div>
</div>

<form class="bg-white rounded-lg shadow p-4 mb-4 grid gap-3 sm:grid-cols-[1fr_auto_auto_auto]"
      hx-get="/artikel" hx-target="#ergebnis" hx-push-url="true" hx-trigger="submit, input from:#q delay:350ms">
  <input id="q" name="q" value="{{ q or '' }}" placeholder="SKU, Titel, MPN, EAN oder OE-Nummer …"
         class="rounded border border-slate-300 px-3 py-2" autocomplete="off">
  <select name="gruppe" class="rounded border border-slate-300 px-3 py-2">
    <option value="">Alle Warengruppen</option>
    {% for group in product_groups %}
    <option value="{{ group.id }}" {% if gruppe == group.id %}selected{% endif %}>{{ group.name }}</option>
    {% endfor %}
  </select>
  <label class="flex items-center gap-2 text-sm px-2">
    <input type="checkbox" name="inaktiv" value="true" {% if inaktiv %}checked{% endif %}>
    inaktive zeigen
  </label>
  <button class="rounded bg-slate-900 text-white px-4 py-2 text-sm">Suchen</button>
</form>

<div id="ergebnis">
  {% include "articles/_table.html" %}
</div>
{% endblock %}
