[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compolog"
version = "0.1.0"
description = "CompoLog - Warenwirtschaft fuer eBay-Handel mit Automotive-Steckverbindern"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "APScheduler>=3.10",
]

[project.optional-dependencies]
# Pulled in from module 1 (import/export) onwards; not required for the skeleton.
io = ["openpyxl>=3.1", "pandas>=2.2"]
# Module 6 (documents) - PDF rendering and ZUGFeRD.
docs = ["weasyprint>=62", "reportlab>=4.2"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "DTZ", "G", "RUF"]
ignore = [
    # SQLAlchemy resolves Mapped["Foo"] through its own class registry. Removing
    # the quotes makes it evaluate Foo in the module namespace instead, which
    # breaks every cross-module relationship.
    "UP037",
    "RUF012",  # mutable class attributes are how SQLAlchemy __table_args__ work
    # German typography uses en dashes and typographic quotes; flagging them as
    # "ambiguous unicode" would mean writing bad German to satisfy a linter.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated; their import order and long literals are not ours.
"alembic/versions/*" = ["E501", "I001", "W291"]

[tool.setuptools.packages.find]
include = ["app*"]
